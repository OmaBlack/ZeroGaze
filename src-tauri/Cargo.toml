[package]
name = "zerogaze"
version = "0.1.0"
description = "ZeroGaze - Privacy-first screen-break & active work tracker"
authors = ["nerdtard <me@ayoolufemi.name.ng>"]
license = "MIT"
edition = "2021"
rust-version = "1.78"

[lib]
name = "zerogaze_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
